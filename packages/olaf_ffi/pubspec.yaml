name: olaf_ffi
description: >
  Olaf acoustic fingerprinting (Joren Six, AGPL-3.0), vendored in C
  and called through dart:ffi. The call belongs on the analysis isolate.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.3.0"

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
