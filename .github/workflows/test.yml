name: Tests

on:
  push:
    branches-ignore:
      - develop
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit:
    name: test:unit
    if: github.head_ref != 'develop' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Tests unitaires
        run: flutter test
