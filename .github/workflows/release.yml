name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run qui contient déjà les artefacts Android, Linux et Windows
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fusion develop vers main
        id: decide
        env:
          PODAVIO_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tool/ci/github_release.sh manual
          else
            tool/ci/github_release.sh gate
          fi

  android:
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: tool/ci/github_release.sh keystore
      - name: APK
        env:
          PODAVIO_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: tool/ci/github_release.sh build-android
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/android/*.apk
          if-no-files-found: error

  linux:
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libsecret-1-dev libcurl4-openssl-dev zlib1g-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Archive Linux
        env:
          PODAVIO_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: tool/ci/github_release.sh build-linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/linux/*.tar.gz
          if-no-files-found: error

  windows:
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Exécutable Windows
        shell: bash
        env:
          PODAVIO_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: tool/ci/github_release.sh build-windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/windows/*.msi
          if-no-files-found: error

  publish:
    needs: [gate, android, linux, windows]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.release == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.android.result == 'success' &&
         needs.linux.result == 'success' &&
         needs.windows.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commit compilé
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin "${{ needs.gate.outputs.sha }}"
          git checkout --detach "${{ needs.gate.outputs.sha }}"
      - name: Artefacts du run
        if: github.event_name == 'workflow_dispatch'
        env:
          PODAVIO_RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "${PODAVIO_RUN_ID}" --name android --dir dist/android
          gh run download "${PODAVIO_RUN_ID}" --name linux --dir dist/linux
          gh run download "${PODAVIO_RUN_ID}" --name windows --dir dist/windows
      - uses: actions/download-artifact@v8
        if: github.event_name != 'workflow_dispatch'
        with:
          name: android
          path: dist/android
      - uses: actions/download-artifact@v8
        if: github.event_name != 'workflow_dispatch'
        with:
          name: linux
          path: dist/linux
      - uses: actions/download-artifact@v8
        if: github.event_name != 'workflow_dispatch'
        with:
          name: windows
          path: dist/windows
      - name: Tag et release
        env:
          PODAVIO_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: tool/ci/github_release.sh publish
