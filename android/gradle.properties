# Le démon lit ces arguments. Le client (gradlew) a le même drapeau
# dans DEFAULT_JVM_OPTS, sinon le JDK avertit sur System.load.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Le versionCode CalVer est le même sur l'APK universel et les APK par ABI.
force-version-code-ignoring-abi=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
