# Pipeline de compilation Podavio (Android + Linux)
# Version CalVer : YYYY.M.<CI_PIPELINE_IID> (ex. 2026.9.42)
# Identifiant unique affiché dans À propos : CI_PIPELINE_ID (GitLab)
#
# L’image Docker Cirrus fournit le SDK Android ; Flutter est installé
# depuis le dépôt officiel (le tag 3.47.5 n’existe pas sur ghcr.io/cirruslabs).

stages:
  - version
  - build
  - release

variables:
  # Branche ou tag Flutter (github.com/flutter/flutter)
  FLUTTER_VERSION: "3.47.5"
  # Image de base (Android SDK) — le tag :stable existe, pas :3.47.5
  FLUTTER_DOCKER_IMAGE: "ghcr.io/cirruslabs/flutter:stable"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  FF_USE_FASTZIP: "true"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"

cache:
  key:
    files:
      - pubspec.lock
  paths:
    - .pub-cache/

version:
  stage: version
  image: alpine:3.21
  script:
    - chmod +x tool/ci/version.sh
    - tool/ci/version.sh --dotenv version.env
  artifacts:
    reports:
      dotenv: version.env
    paths:
      - version.env
    expire_in: 1 week

.setup_flutter: &setup_flutter
  - |
    set -euo pipefail
    if [ ! -x /opt/flutter-podavio/bin/flutter ]; then
      git clone --branch "${FLUTTER_VERSION}" --depth 1 \
        https://github.com/flutter/flutter.git /opt/flutter-podavio
    fi
    export PATH="/opt/flutter-podavio/bin:${PATH}"
    flutter --version
    flutter config --no-analytics
    flutter pub get

.build_flutter:
  image: ${FLUTTER_DOCKER_IMAGE}
  needs:
    - job: version
      artifacts: true
  before_script:
    - *setup_flutter
  interruptible: true

build:android:
  extends: .build_flutter
  stage: build
  script:
    - |
      set -euo pipefail
      export PATH="/opt/flutter-podavio/bin:${PATH}"
      FLAGS=(
        --build-name="${PODAVIO_VERSION}"
        --build-number="${PODAVIO_BUILD}"
        --dart-define=PODAVIO_VERSION="${PODAVIO_VERSION}"
        --dart-define=GITLAB_PIPELINE_ID="${PODAVIO_GITLAB_ID}"
      )
      flutter build apk --release "${FLAGS[@]}"
      flutter build apk --release --split-per-abi "${FLAGS[@]}"
      mkdir -p dist/android
      for apk in build/app/outputs/flutter-apk/*.apk; do
        name="$(basename "${apk}" .apk)"
        cp "${apk}" "dist/android/${name}-${PODAVIO_VERSION}.apk"
      done
      ls -lh dist/android
  artifacts:
    name: "podavio-android-${PODAVIO_VERSION}"
    paths:
      - dist/android/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

build:linux:
  extends: .build_flutter
  stage: build
  before_script:
    - apt-get update
    - |
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
        clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
        libstdc++-12-dev
    - *setup_flutter
  script:
    - |
      set -euo pipefail
      export PATH="/opt/flutter-podavio/bin:${PATH}"
      FLAGS=(
        --build-name="${PODAVIO_VERSION}"
        --build-number="${PODAVIO_BUILD}"
        --dart-define=PODAVIO_VERSION="${PODAVIO_VERSION}"
        --dart-define=GITLAB_PIPELINE_ID="${PODAVIO_GITLAB_ID}"
      )
      flutter build linux --release "${FLAGS[@]}"
      mkdir -p dist/linux
      bundle="dist/linux/podavio-${PODAVIO_VERSION}-linux-x64"
      cp -a build/linux/x64/release/bundle "${bundle}"
      tar -C dist/linux -czf "${bundle}.tar.gz" "$(basename "${bundle}")"
      rm -rf "${bundle}"
      ls -lh dist/linux
  artifacts:
    name: "podavio-linux-${PODAVIO_VERSION}"
    paths:
      - dist/linux/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: version
      artifacts: true
    - job: build:android
      artifacts: true
    - job: build:linux
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - echo "Publication de Podavio ${PODAVIO_VERSION} (GitLab ${PODAVIO_GITLAB_ID})"
  release:
    tag_name: "$PODAVIO_VERSION"
    name: "Podavio $PODAVIO_VERSION"
    description: |
      Compilation CalVer **$PODAVIO_VERSION**

      - Identifiant GitLab : `$PODAVIO_GITLAB_ID`
      - Commit : $CI_COMMIT_SHORT_SHA

      Artefacts disponibles sur les jobs `build:android` et `build:linux` de ce pipeline.
    ref: "$CI_COMMIT_SHA"
