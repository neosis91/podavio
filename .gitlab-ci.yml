# Pipeline de compilation Podavio (Android + Linux + Windows)
# Version CalVer : YYYY.M.N — le numéro N vient du tag Git (manuel).
#
# Flux :
# 1. Créer un tag CalVer (ex. 2026.10.2) sur le commit à publier
# 2. Pipeline du tag → version + builds + release
#
# L’image Docker Cirrus fournit le SDK Android ; Flutter est cloné depuis
# github.com/flutter/flutter (le tag :3.47.5 n’existe pas sur ghcr.io/cirruslabs).
# Windows utilise le runner SaaS `saas-windows-medium-amd64` (pas d’image Docker).
#
# La release publie uniquement les paquets + un manifeste JSON.
# GitLab ajoute toujours des liens « Source code » sur la page Release ;
# pour les masquer : Visibilité → Dépôt = Membres, Releases = Tout le monde.

stages:
  - merge_checks
  - version
  - build
  - release

variables:
  # Branche ou tag Flutter (github.com/flutter/flutter)
  FLUTTER_VERSION: "3.47.5"
  # Image de base avec SDK Android — utiliser :stable (pas :3.47.5)
  FLUTTER_DOCKER_IMAGE: "ghcr.io/cirruslabs/flutter:stable"
  FLUTTER_HOME: "/opt/flutter-podavio"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  FF_USE_FASTZIP: "true"

workflow:
  rules:
    # Version + builds + release sur tag CalVer.
    # Déclenchement manuel possible via web / pipeline.
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    # Contrôle squash des merge requests (voir check:squash_policy).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

cache:
  key:
    files:
      - pubspec.lock
  paths:
    - .pub-cache/

# Cibles MR (Free) : develop→main, sinon→develop.
# (Les Target branch rules natives sont Premium.)
check:mr_target:
  stage: merge_checks
  image: alpine:3.21
  script:
    - chmod +x tool/ci/check_mr_target.sh
    - tool/ci/check_mr_target.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# GitLab ne permet pas un squash « always » / « never » par branche cible.
# default_on au projet + ce job :
# - vers develop → squash obligatoire
# - develop→main → squash interdit
check:squash_policy:
  stage: merge_checks
  image: alpine:3.21
  script:
    - apk add --no-cache curl jq
    - chmod +x tool/ci/check_squash_policy.sh
    - tool/ci/check_squash_policy.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

version:
  stage: version
  image: alpine:3.21
  script:
    - chmod +x tool/ci/version.sh
    - tool/ci/version.sh --dotenv version.env
  artifacts:
    reports:
      dotenv: version.env
    paths:
      - version.env
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"

.build_flutter:
  image: ${FLUTTER_DOCKER_IMAGE}
  needs:
    - job: version
      artifacts: true
  before_script:
    - chmod +x tool/ci/setup_flutter.sh
    - . tool/ci/setup_flutter.sh
  interruptible: true

.build_rules: &build_rules
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "web"

build:android:
  extends: .build_flutter
  stage: build
  script:
    - |
      set -euo pipefail
      export PATH="${FLUTTER_HOME}/bin:${PATH}"
      # Signature release : variables GitLab (voir docs/android-signing.md)
      chmod +x tool/ci/setup_android_signing.sh
      . tool/ci/setup_android_signing.sh
      FLAGS=(
        --build-name="${PODAVIO_VERSION}"
        --build-number="${PODAVIO_BUILD}"
        --dart-define=PODAVIO_VERSION="${PODAVIO_VERSION}"
        --dart-define=GITLAB_PIPELINE_ID="${PODAVIO_GITLAB_ID}"
        --dart-define=GITLAB_COMMIT_SHA="${CI_COMMIT_SHORT_SHA}"
      )
      flutter build apk --release "${FLAGS[@]}"
      flutter build apk --release --split-per-abi "${FLAGS[@]}"
      mkdir -p dist/android
      cp build/app/outputs/flutter-apk/app-release.apk \
        "dist/android/podavio-${PODAVIO_VERSION}-android-universal.apk"
      cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
        "dist/android/podavio-${PODAVIO_VERSION}-android-armeabi-v7a.apk"
      cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
        "dist/android/podavio-${PODAVIO_VERSION}-android-arm64-v8a.apk"
      cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
        "dist/android/podavio-${PODAVIO_VERSION}-android-x86_64.apk"
      ls -lh dist/android
  artifacts:
    name: "podavio-android-${PODAVIO_VERSION}"
    paths:
      - dist/android/
    expire_in: 30 days
  rules: *build_rules

build:linux:
  extends: .build_flutter
  stage: build
  before_script:
    - apt-get update
    - |
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
        clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
        libstdc++-12-dev
    - chmod +x tool/ci/setup_flutter.sh
    - . tool/ci/setup_flutter.sh
  script:
    - |
      set -euo pipefail
      export PATH="${FLUTTER_HOME}/bin:${PATH}"
      FLAGS=(
        --build-name="${PODAVIO_VERSION}"
        --build-number="${PODAVIO_BUILD}"
        --dart-define=PODAVIO_VERSION="${PODAVIO_VERSION}"
        --dart-define=GITLAB_PIPELINE_ID="${PODAVIO_GITLAB_ID}"
        --dart-define=GITLAB_COMMIT_SHA="${CI_COMMIT_SHORT_SHA}"
      )
      # Même CalVer que BuildInfo / .desktop (CMake lit $PODAVIO_VERSION).
      flutter build linux --release "${FLAGS[@]}"
      mkdir -p dist/linux
      bundle="dist/linux/podavio-${PODAVIO_VERSION}-linux-x64"
      cp -a build/linux/x64/release/bundle "${bundle}"
      tar -C dist/linux -czf "${bundle}.tar.gz" "$(basename "${bundle}")"
      rm -rf "${bundle}"
      ls -lh dist/linux
  artifacts:
    name: "podavio-linux-${PODAVIO_VERSION}"
    paths:
      - dist/linux/
    expire_in: 30 days
  rules: *build_rules

build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  needs:
    - job: version
      artifacts: true
  variables:
    FLUTTER_HOME: "C:\\flutter-podavio"
  interruptible: true
  before_script:
    - powershell -ExecutionPolicy Bypass -File tool/ci/setup_flutter.ps1
  script:
    - |
      $ErrorActionPreference = "Stop"
      $env:PATH = "$env:FLUTTER_HOME\bin;$env:PATH"
      $flags = @(
        "--build-name=$env:PODAVIO_VERSION",
        "--build-number=$env:PODAVIO_BUILD",
        "--dart-define=PODAVIO_VERSION=$env:PODAVIO_VERSION",
        "--dart-define=GITLAB_PIPELINE_ID=$env:PODAVIO_GITLAB_ID",
        "--dart-define=GITLAB_COMMIT_SHA=$env:CI_COMMIT_SHORT_SHA"
      )
      flutter build windows --release @flags
      New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
      $src = "build\windows\x64\runner\Release"
      if (-not (Test-Path $src)) {
        $src = "build\windows\runner\Release"
      }
      $zip = "dist\windows\podavio-$env:PODAVIO_VERSION-windows-x64.zip"
      if (Test-Path $zip) { Remove-Item $zip }
      Compress-Archive -Path "$src\*" -DestinationPath $zip
      Get-ChildItem dist\windows | Format-Table Name, Length
  artifacts:
    name: "podavio-windows-${PODAVIO_VERSION}"
    paths:
      - dist\windows/
    expire_in: 30 days
  rules: *build_rules

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: version
      artifacts: true
    - job: build:android
      artifacts: true
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
  # Uniquement sur un tag CalVer.
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl coreutils
  script:
    - chmod +x tool/ci/publish_release.sh
    - tool/ci/publish_release.sh
  artifacts:
    name: "podavio-release-${PODAVIO_VERSION}"
    paths:
      - dist/release/
    expire_in: 90 days
